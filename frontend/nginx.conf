server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Soporte para rutas del SPA (React Router, etc.)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache de estáticos con hash (build de Vite)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
